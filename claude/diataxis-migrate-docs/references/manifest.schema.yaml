type: object
additionalProperties: false
required:
  - schema_version
  - run
  - repository
  - scope
  - approved_policies
  - claim_authorities
  - section_ledger
  - evidence
  - findings
  - verification
  - update_baseline
  - archive
properties:
  schema_version:
    type: integer
    enum:
      - 1
  run:
    type: object
    additionalProperties: false
    required:
      - mode
      - status
      - started_at
      - completed_at
    properties:
      id:
        type:
          - string
          - "null"
        pattern: "^[0-9]{8}T[0-9]{6}Z-[0-9a-f]{7,40}$"
      mode:
        type: string
        enum:
          - migrate
          - audit
          - update
          - manage
      status:
        type: string
        enum:
          - planned
          - in_progress
          - blocked
          - complete
      started_at:
        type:
          - string
          - "null"
        minLength: 1
      completed_at:
        type:
          - string
          - "null"
        minLength: 1
  repository:
    type: object
    additionalProperties: false
    required:
      - baseline_revision
      - current_revision
      - dirty_paths
    properties:
      baseline_revision:
        type:
          - string
          - "null"
        pattern: "^[0-9a-f]{7,64}$"
      current_revision:
        type:
          - string
          - "null"
        pattern: "^[0-9a-f]{7,64}$"
      dirty_paths:
        type: array
        items:
          type: string
          minLength: 1
  scope:
    type: object
    additionalProperties: false
    required:
      - docs_domain
      - locale
    properties:
      docs_domain:
        type: string
        minLength: 1
      locale:
        type: string
        pattern: "^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$"
      excluded_paths:
        type: array
        items:
          type: string
          minLength: 1
  approved_policies:
    type: object
    additionalProperties: false
    required:
      - write_approved
      - archive_retention
    properties:
      write_approved:
        type: boolean
      archive_retention:
        type: string
        enum:
          - retain
          - delete_after_clean_audit
      archive_deletion_approved:
        type: boolean
      approved_plan:
        type:
          - string
          - "null"
  claim_authorities:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - claim
        - sources
      properties:
        claim:
          type: string
          minLength: 1
        sources:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        decision:
          type:
            - string
            - "null"
  section_ledger:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - source_path
        - section_id
        - source_fingerprint
        - disposition
      properties:
        source_path:
          type: string
          minLength: 1
        section_id:
          type: string
          pattern: "^(?:__preamble__|[a-z0-9]+(?:-[a-z0-9]+)*)$"
        source_fingerprint:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        disposition:
          type: string
          enum:
            - migrated
            - retired
            - blocked
        destination_path:
          type:
            - string
            - "null"
          minLength: 1
        destination_anchor:
          type:
            - string
            - "null"
        notes:
          type:
            - string
            - "null"
          minLength: 1
        reason:
          type:
            - string
            - "null"
          minLength: 1
  evidence:
    type: array
    items:
      type: object
  findings:
    type: array
    items:
      type: object
  verification:
    type: array
    items:
      type: object
  update_baseline:
    type: object
    additionalProperties: false
    required:
      - revision
    properties:
      revision:
        type:
          - string
          - "null"
        pattern: "^[0-9a-f]{7,64}$"
  archive:
    type: object
    additionalProperties: false
    required:
      - path
      - status
    properties:
      path:
        type:
          - string
          - "null"
        minLength: 1
      status:
        type: string
        enum:
          - not_created
          - created
          - retained
          - deleted
