# The type safety of TypeScript code and its compiler configuration, read
# from the source and the tsconfig.json chain, not by running the compiler
# or a linter. Each check rests on a finding in research.md beside this file.
# What a check reads for a diff follows the module contract's `diff` input
# kind. A declaration file generated by a build or shipped in a dependency is
# not read as the project's code.
id: typescript-type-safety
languages: [typescript]
concept: type-safety
triggers:
  files:
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.mts"
    - "**/*.cts"
    - "**/tsconfig*.json"
  manifests:
    - tsconfig.json
  design-markers: []
  design-headings: []
inputs: [diff, repository]
phases: [static]
checks:
  - id: typescript-type-safety/strict-checks-disabled
    statement: >-
      The project compiles without the compiler's null checks or its
      implicit-any check, so `null`, `undefined` and uninferred types pass
      unchecked.
    evidence: >-
      The `tsconfig.json` that compiles the code in scope, and every file
      its `extends` chain names, read and quoted at the version the project
      resolves, showing the resolved setting: `strict` set false, or
      absent under a compiler older than 6.0, whose default was false, with
      `strictNullChecks` or `noImplicitAny` not set true; or `strict` on with
      either of them set false. The compiler version is quoted from the
      manifest or lockfile; when it cannot be read, an absent `strict` is
      named as unresolved and not reported. An `extends` target that cannot
      be read is named and the check is not reported. For a diff, it is
      reported only when the diff changes the setting, the compiler
      version, an `extends` target's version, or adds the configuration.
    severity: high
    rationale: >-
      Without these two checks the compiler accepts a possibly missing value
      as present and a value of unknown type as anything, so the null
      dereferences and shape mismatches typing exists to prevent compile
      cleanly and fail at run time.
    references:
      - https://www.typescriptlang.org/tsconfig/#strict
      - https://www.typescriptlang.org/tsconfig/#strictNullChecks
      - https://www.typescriptlang.org/tsconfig/#noImplicitAny
      - https://www.typescriptlang.org/docs/handbook/release-notes/typescript-6-0.html
    findings: [strict-family-is-opt-in, strict-default-depends-on-the-compiler]
  - id: typescript-type-safety/unchecked-index-read
    statement: >-
      A value read through an index signature is used as present without a
      check, while the compiler types such reads as never missing.
    evidence: >-
      The read quoted with its file and line, on a type declared with an
      index signature or a `Record` over a wide key type such as `string`,
      used without a presence check, a default or optional chaining before
      its members or its value are used; and the resolved `tsconfig.json`
      setting quoted, showing `noUncheckedIndexedAccess` not set true. A key
      just proven present, as in a loop over the object's own keys, is not
      this defect.
    severity: low
    rationale: >-
      A key that is absent yields `undefined` where the type promised a
      value, so the failure surfaces later, away from the read, as a
      dereference error or a corrupted result.
    references:
      - https://www.typescriptlang.org/tsconfig/#noUncheckedIndexedAccess
    findings: [unchecked-indexing-is-outside-strict]
  - id: typescript-type-safety/explicit-any
    statement: >-
      Code declares a value, parameter or return type as `any`, switching
      type checking off for it and everything it flows into.
    evidence: >-
      The `any` annotation quoted with its file and line, as a type, an
      array element or a generic argument, in code that is not a generated
      or dependency declaration file, with no adjacent comment stating why
      no narrower type or `unknown` serves. An `any` in a test with such a
      comment, for a partial mock, is not this defect, and neither is a rest
      parameter forwarding arguments unchanged.
    severity: medium
    rationale: >-
      An `any` accepts every read, call and assignment, so a type error at
      that value, or anywhere it is passed on, compiles cleanly and ships.
    references:
      - https://typescript-eslint.io/rules/no-explicit-any/
      - https://typescript-eslint.io/rules/no-unsafe-assignment/
      - https://google.github.io/styleguide/tsguide.html
    findings: [any-disables-checking, any-propagates]
  - id: typescript-type-safety/untrusted-data-typed-without-validation
    statement: >-
      Data from outside the program is given a specific type without being
      checked, so the type describes what the code hopes for rather than
      what arrived.
    evidence: >-
      The expression quoted with its file and line: the result of
      `JSON.parse`, a fetch body's `json()`, a message or request body, or
      another `any`-typed source named by its declaration, asserted with
      `as T`, assigned to a variable or parameter of a type other than
      `any` or `unknown`, or returned as one; and the code between source
      and use read, showing no type guard, assertion function, schema parse
      or property checks on it. This check is reported in place of the
      assertion checks for the same expression.
    severity: high
    rationale: >-
      The data's shape is decided by whoever sent it, so a missing or
      mistyped field passes the compiler and fails deep inside code that
      trusted the type, or is stored and passed on corrupted.
    references:
      - https://typescript-eslint.io/rules/no-unsafe-assignment/
      - https://typescript-eslint.io/rules/no-unsafe-type-assertion/
      - https://www.typescriptlang.org/docs/handbook/2/everyday-types.html
    findings: [boundary-apis-return-any, assertions-have-no-runtime-effect, any-propagates]
  - id: typescript-type-safety/narrowing-assertion-without-check
    statement: >-
      A type assertion narrows a value to a more specific type that nothing
      in the code has checked.
    evidence: >-
      The `as T` or `<T>` assertion quoted with its file and line, the
      declared type of the expression it narrows, such as a union,
      `unknown` or a base type, and the code before it read, showing no
      check that establishes `T`, with no adjacent comment stating why the
      assertion holds. `as const`, an assertion that widens, and an
      assertion on a DOM lookup whose element the same file creates are not
      this defect. An assertion to a type parameter, constrained or not, is
      reported like any other, in a generic helper too: the parameter can
      be instantiated with a narrower type than the code built. An adjacent
      comment stating why the assertion holds clears it there as anywhere.
    severity: medium
    rationale: >-
      An assertion is erased at compile time, so when the value is not a `T`
      nothing fails at the assertion and the error appears later, where the
      missing member is used.
    references:
      - https://typescript-eslint.io/rules/no-unsafe-type-assertion/
      - https://www.typescriptlang.org/docs/handbook/2/everyday-types.html
      - https://google.github.io/styleguide/tsguide.html
    findings: [assertions-have-no-runtime-effect, type-parameter-assertions-are-unsafe]
  - id: typescript-type-safety/double-assertion
    statement: >-
      A value is asserted through `unknown` or `any` to a type the compiler
      had refused as unrelated.
    evidence: >-
      The `as unknown as T` or `as any as T` chain quoted with its file and
      line, with no adjacent comment stating why the value is in fact a
      `T`.
    severity: medium
    rationale: >-
      The compiler refuses an assertion between unrelated types because it
      is almost always wrong; going around the refusal keeps the error and
      removes the only warning of it.
    references:
      - https://www.typescriptlang.org/docs/handbook/2/everyday-types.html
      - https://google.github.io/styleguide/tsguide.html
    findings: [double-assertion-escapes-the-relation-check]
  - id: typescript-type-safety/object-literal-asserted-not-annotated
    statement: >-
      An object literal is asserted to a type instead of being annotated
      with it, so missing and misnamed properties go unreported.
    evidence: >-
      The `{ ... } as T` expression quoted with its file and line, where an
      annotation on the variable, parameter or return type could carry `T`,
      and the declaration of `T` read, naming a required property the
      literal lacks or a property it has that `T` does not. A literal that
      matches `T` exactly is not reported: the assertion hides nothing yet.
    severity: low
    rationale: >-
      An annotated literal is checked for missing and excess properties and
      an asserted one is not, so a renamed or newly required field leaves an
      object that type-checks and is wrong.
    references:
      - https://typescript-eslint.io/rules/consistent-type-assertions/
      - https://google.github.io/styleguide/tsguide.html
    findings: [literal-annotation-over-assertion]
  - id: typescript-type-safety/non-null-assertion-without-check
    statement: >-
      A non-null assertion, the postfix `!`, removes `null` or `undefined`
      from a value that nothing has checked.
    evidence: >-
      The `!` quoted with its file and line, the declared type of the
      operand showing `null` or `undefined`, and the code before it in the
      same scope read, showing no check the compiler cannot see, such as a
      prior `has` on the same map key, and no adjacent comment stating why
      the value is present. A definite assignment assertion on a class
      field set by a framework the file names is not this defect.
    severity: medium
    rationale: >-
      The assertion has no runtime effect, so when the value is missing the
      code fails at the use with a dereference error, the very case the
      type was declared to warn about.
    references:
      - https://typescript-eslint.io/rules/no-non-null-assertion/
      - https://www.typescriptlang.org/docs/handbook/2/everyday-types.html
      - https://google.github.io/styleguide/tsguide.html
    findings: [non-null-assertion-is-unchecked]
  - id: typescript-type-safety/type-check-suppressed
    statement: >-
      A comment directive suppresses the compiler's errors for a line or a
      file.
    evidence: >-
      The `@ts-ignore` or `@ts-nocheck` comment quoted with its file and
      line, or a `@ts-expect-error` with no description after it. A
      `@ts-expect-error` with a description, in a test that asserts a type
      error, is not this defect.
    severity: medium
    rationale: >-
      A suppressed line or file stops reporting every error in it, present
      and future, so the error the directive was written for is joined
      unseen by the next one.
    references:
      - https://typescript-eslint.io/rules/ban-ts-comment/
      - https://google.github.io/styleguide/tsguide.html
    findings: [suppression-directives-hide-errors]
  - id: typescript-type-safety/caught-value-used-as-typed
    statement: >-
      A caught value is used as a known type without being narrowed.
    evidence: >-
      The `catch` clause or promise rejection callback quoted with its file
      and line, and a use of the caught value's members or a pass of it as
      a typed argument, with no `instanceof`, type guard or other check
      before the use; and either the parameter annotated `any`, a rejection
      callback's parameter left unannotated, or the resolved
      `tsconfig.json` quoted showing `useUnknownInCatchVariables` off.
    severity: low
    rationale: >-
      Anything can be thrown, a string or `undefined` as well as an `Error`,
      so the error handler itself throws or loses the error it was written
      to report.
    references:
      - https://www.typescriptlang.org/tsconfig/#useUnknownInCatchVariables
      - https://typescript-eslint.io/rules/use-unknown-in-catch-callback-variable/
    findings: [caught-values-are-unknown]
  - id: typescript-type-safety/type-guard-does-not-check
    statement: >-
      A type predicate or assertion function does not check what its
      signature claims, so the compiler narrows on a promise the body does
      not keep.
    evidence: >-
      The function quoted with its file and line, with its `x is T` or
      `asserts` signature and its whole body, showing one of three forms: a
      predicate whose body returns a constant or tests none of the members
      that distinguish `T` from the rest of the parameter's type; a
      predicate whose body only casts and checks one optional member that
      other members of the union also carry; or an assertion function with
      a path that returns normally when the condition fails. The members of
      `T` are read from its declaration and named.
    severity: high
    rationale: >-
      The compiler trusts the signature, so every caller's narrowed code is
      typed on a check that never ran, and the wrong value reaches code the
      compiler believes is safe.
    references:
      - https://www.typescriptlang.org/docs/handbook/release-notes/typescript-3-7.html
      - https://www.typescriptlang.org/docs/handbook/2/narrowing.html
    findings: [assertion-signatures-are-trusted, type-predicates-are-author-checked]
  - id: typescript-type-safety/switch-not-exhaustive
    statement: >-
      A `switch` over a union or an enum leaves a member unhandled with no
      `default` and no exhaustiveness check.
    evidence: >-
      The `switch` quoted with its file and line, the declaration of the
      discriminant's type read and its members listed, the member or
      members with no `case`, and no `default` clause, in a function whose
      declared return type does not already make the gap a compile error.
    severity: medium
    rationale: >-
      A member added to the union later falls through the `switch` silently,
      so the new case is handled by doing nothing and no error points at
      the code that needed to change.
    references:
      - https://typescript-eslint.io/rules/switch-exhaustiveness-check/
      - https://www.typescriptlang.org/docs/handbook/2/narrowing.html
    findings: [exhaustiveness-is-checked-only-when-asked]
